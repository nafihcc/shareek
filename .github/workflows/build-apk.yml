name: Build Android APK

# Builds on every push to main, from the Actions tab ("Run workflow"), or when
# you push a tag like apk-v1.0.0. The APK is published to a GitHub release:
#   main / manual run -> rolling release "apk-latest" (stable download link)
#   apk-v* tag        -> a release named after the tag
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["apk-v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the website for the app
        # The app serves the site from its own root, so the base path is "/".
        run: |
          BASE_PATH=/ npm run build:gh
          mv dist-gh/gh-index.html dist-gh/index.html
          mkdir -p android/app/src/main/assets/www
          cp -r dist-gh/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk shareek-pray-first.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shareek-pray-first-apk
          path: shareek-pray-first.apk

      - name: Publish APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'apk-latest' }}
          name: Shareek APK
          body: "Debug-signed APK. Install it on your phone and allow 'install unknown apps'. See android/README.md for setup."
          files: shareek-pray-first.apk
          make_latest: true
